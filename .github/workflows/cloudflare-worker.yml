name: Deploy to Cloudflare Worker

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VISIT_LOGS_ADMIN_PASSWORD: ${{ secrets.VISIT_LOGS_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Prepare Cloudflare Worker configuration
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/create-cloudflare-worker-config.mjs

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          for migration in migrations/*.sql; do
            pnpm exec wrangler d1 execute "$CLOUDFLARE_D1_DATABASE_ID" --remote --file="$migration"
          done

      - name: Deploy to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ -n "$VISIT_LOGS_ADMIN_PASSWORD" ]; then
            printf 'VISIT_LOGS_ADMIN_PASSWORD=%s\n' "$VISIT_LOGS_ADMIN_PASSWORD" > .worker.secrets.env
            pnpm exec wrangler deploy src/worker.ts --config wrangler.deploy.json --no-autoconfig --secrets-file .worker.secrets.env 2>&1 | tee deploy-output.txt
          else
            pnpm exec wrangler deploy src/worker.ts --config wrangler.deploy.json --no-autoconfig 2>&1 | tee deploy-output.txt
          fi

          version_id="$(sed -n 's/.*Current Version ID: \([0-9a-f-]*\).*/\1/p' deploy-output.txt | tail -n 1)"
          test -n "$version_id"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Send all traffic to the deployed Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler versions deploy "${{ steps.deploy.outputs.version_id }}@100%" --name firefly --yes
